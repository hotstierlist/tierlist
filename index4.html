    body { background: #000; color: #fff; font-family: sans-serif; }

    .tooltip-content {
      position: absolute;
      left: 0;
      top: 100%;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      display: block;
      width: max-content;
      min-width: 800px;
      max-width: 1200px;
      background-color: #111827;
      border: 1px solid #3b82f6;
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      gap: 1rem;
      visibility: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }

    .tooltip-content.open {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      pointer-events: auto;
    }

    .tooltip-left { flex: 0 0 28%; display: flex; flex-direction: column; gap: 0.75rem; }
    .tooltip-right { flex: 0 0 72%; margin-left: 1.25rem; }

    .player-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem;
      border: 1px solid #444;
      border-radius: 0.75rem;
      background-color: #1e1e2f;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: visible;
      z-index: 1;
    }

    .player-row:hover {
      border-color: #3b82f6;
      box-shadow: 0 0 20px rgba(100,150,255,0.6);
    }

    .signature-heroes { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .signature-heroes img { width: 48px; height: 48px; border-radius: 0.5rem; object-fit: cover; }
    .tooltip-rank { font-weight: bold; color: #3b82f6; margin-right: 0.5rem; min-width: 2rem; }
    .alternate-ids { color: #827ee9; margin-top: 0.75rem; font-size: 0.875rem; line-height: 1.45; }
    .recommendation { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.25rem; font-weight: 700; font-size: 0.9rem; }
    .recommended { color: #22c55e; }

const container = document.getElementById("playerList");
const searchInput = document.getElementById("search");

const globalTooltip = document.createElement("div");
globalTooltip.className = "tooltip-content";
Object.assign(globalTooltip.style, { position: "fixed", top: "0px", left: "0px", zIndex: 999999999, pointerEvents: "none" });
document.body.appendChild(globalTooltip);

function showTooltip(content, row) {
  try {
    globalTooltip.innerHTML = content;
    globalTooltip.classList.add("open");
    globalTooltip.style.pointerEvents = "auto";

    const rect = row.getBoundingClientRect();
    const tooltipWidth = 820;
    const tooltipHeight = 360;
    const left = Math.max(12, Math.min(rect.left, window.innerWidth - tooltipWidth - 12));
    const top = Math.max(12, Math.min(rect.bottom + 8, window.innerHeight - tooltipHeight - 12));

    globalTooltip.style.left = `${left}px`;
    globalTooltip.style.top = `${top}px`;
  } catch (error) {
    console.error("Tooltip render error:", error);
  }
}

function hideTooltip() {
  globalTooltip.classList.remove("open");
  globalTooltip.style.pointerEvents = "none";
}

function prettyLabel(label) {
  if (label === "Skill") return "Skill Level";
  if (label === "PKill") return "Kill Participation";
  if (label === "Talent Choices") return "Talent Success Rate";
  return label || "Unknown";
}

function normalizeStats(stats) {
  if (typeof stats !== "string" || !stats.trim()) {
    return "Skill: n/a | KDA: n/a | PKill: n/a | Individual WR%: n/a | Positioning: n/a | Talent Choices: n/a | Social: n/a | Behavior: n/a";
  }
  return stats;
}

function normalizeHeroes(heroes) {
  if (!Array.isArray(heroes) || heroes.length === 0) {
    return [
      "https://via.placeholder.com/48?text=H1",
      "https://via.placeholder.com/48?text=H2",
      "https://via.placeholder.com/48?text=H3"
    ];
  }
  return heroes.slice(0, 3);
}

function sanitizePlayer(player, fallbackRank) {
  return {
    name: typeof player?.name === "string" && player.name.trim() ? player.name : `Player ${fallbackRank}`,
    rank: Number.isFinite(player?.rank) ? player.rank : fallbackRank,
    flag: typeof player?.flag === "string" && player.flag.trim() ? player.flag : "fi fi-eu",
    stats: normalizeStats(player?.stats),
    alternateIDs: typeof player?.alternateIDs === "string" ? player.alternateIDs : "",
    recommended: Boolean(player?.recommended),
    lore: typeof player?.lore === "string" && player.lore.trim() ? player.lore : "No description available yet.",
    signatureHeroes: normalizeHeroes(player?.signatureHeroes)
  };
}

players = Array.isArray(players) ? players.map((player, index) => sanitizePlayer(player, index + 1)) : [];

function statsHtml(stats) {
  return normalizeStats(stats).split(" | ").map(stat => {
    const [label, value = "n/a"] = stat.split(": ");
    return `<div style="color:#cbd5e1; font-size:0.8rem; letter-spacing:0.01em;">${prettyLabel(label)}</div><div style="color:#f8fafc; font-weight:700; font-size:0.82rem; text-align:right; min-width:1.5rem;">${value}</div>`;
  }).join("");
}

function renderList(filter = "") {
  if (!container) return;
  container.innerHTML = "";

  const lowered = String(filter || "").toLowerCase();
  const filtered = players.filter(player =>
    [player.name, player.stats, player.alternateIDs, player.lore].join(" ").toLowerCase().includes(lowered)
  );

  filtered.forEach(player => {
    const card = document.createElement("div");
    card.className = "player-row relative overflow-visible";

    const header = document.createElement("div");
    header.className = "flex items-center gap-5 text-lg font-semibold";
    header.innerHTML = `<span class='tooltip-rank'>#${player.rank}</span><span class='${player.flag} w-6 h-4 mr-6'></span><span class='ml-4'>${player.name}</span>`;
    card.appendChild(header);

    const tooltipContent = `
      <div style='display:flex; gap:1.25rem; align-items:flex-start;'>
        <div class='tooltip-left'>
          <div class="font-medium text-gray-100 flex items-center gap-4" style="font-size:1rem;"><span class='${player.flag} w-6 h-4'></span> ${player.name} - #${player.rank}</div>
          <div class="stats-grid" style="display:grid; grid-template-columns: 1fr auto; gap:0.45rem 0.9rem; padding:0.85rem 0.95rem; background:rgba(255,255,255,0.03); border:1px solid rgba(96,165,250,0.18); border-radius:0.8rem;">
            ${statsHtml(player.stats)}
          </div>
          <div class="recommendation ${player.recommended ? 'recommended' : 'not-recommended'}">
            <span>${player.recommended ? '👍' : '👎'}</span> ${player.recommended ? 'Recommended' : 'Not Recommended'}
          </div>
          <div class="mt-1 font-semibold text-gray-200" style="font-size:0.92rem;">Signature Heroes</div>
          <div class="signature-heroes">${player.signatureHeroes.map(src => `<img src='${src}' alt='Hero portrait'>`).join("")}</div>
        </div>
        <div class='tooltip-right'>
          <div class='text-gray-300 text-sm mt-1' style='line-height:1.65;'>${player.lore}</div>
          <div class='alternate-ids'>Alternate IDs: ${player.alternateIDs || '—'}</div>
        </div>
      </div>`;

    card.addEventListener("mouseenter", () => showTooltip(tooltipContent, card));
    card.addEventListener("mouseleave", hideTooltip);
    container.appendChild(card);
  });
}

if (searchInput) {
  searchInput.addEventListener("input", e => renderList(e.target.value));
}
window.addEventListener("resize", hideTooltip);
window.addEventListener("scroll", hideTooltip, { passive: true });

try {
  renderList();
} catch (error) {
  console.error("Initial render failed:", error);
  if (container) {
    container.innerHTML = `<div style="padding:1rem; border:1px solid #7f1d1d; border-radius:0.75rem; background:#1f1111; color:#fecaca;">The player list failed to render. Check the browser console for details.</div>`;
  }
}

console.assert(Array.isArray(players), "players should be an array");
console.assert(players.length === 74, "Expected 74 players to render");
console.assert(document.getElementById("playerList"), "playerList container must exist");
</script>
</body>
</html>
